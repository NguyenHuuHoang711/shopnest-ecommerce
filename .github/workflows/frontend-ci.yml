name: ShopNest Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/nguyenhuuhoang711/shopnest-frontend

jobs:
  build-and-deploy:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install & Test Frontend Build
        working-directory: frontend
        run: |
          npm install
          npm run build
          echo "✅ Frontend build test passed!"

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Jenkins on Spot VM to Deploy
        run: |
          echo "Triggering Jenkins deployment webhook on Spot VM..."
          curl -s -X POST 'http://34.143.239.87:8080/generic-webhook-trigger/invoke?token=shopnest-deploy' \
            -H 'Content-Type: application/json' \
            -d '{"ref": "refs/heads/main", "after": "${{ github.sha }}"}' || true
          echo "✅ Jenkins deployment triggered successfully!"
