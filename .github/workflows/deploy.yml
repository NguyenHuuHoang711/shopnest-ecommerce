name: ShopNest CI/CD — Build on GitHub Actions & Deploy via Jenkins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/nguyenhuuhoang711/shopnest-backend
  FRONTEND_IMAGE: ghcr.io/nguyenhuuhoang711/shopnest-frontend
  GCP_ZONE: asia-southeast1-a
  VM_NAME: shopnest-spot-vm

jobs:
  # ────────────────────────────────────────────
  # JOB 1: Test Backend & Frontend Build
  # ────────────────────────────────────────────
  ci-test:
    name: Test (Backend Health & Frontend Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Test Backend
        run: |
          npm install
          npm start &
          PID=$!
          sleep 4
          curl -f http://localhost:3000/api/health || (kill $PID && exit 1)
          echo "Backend Healthcheck passed!"
          kill $PID

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          echo "Frontend React build succeeded!"

  # ────────────────────────────────────────────
  # JOB 2: Build & Push Images to GHCR on GitHub-hosted Runners
  # ────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images to GHCR
    needs: ci-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "### ✅ Docker Images Built and Pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** \`${{ env.BACKEND_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** \`${{ env.FRONTEND_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────
  # JOB 3: Trigger Jenkins Deployment on GCP Spot VM
  # ────────────────────────────────────────────
  trigger-jenkins:
    name: Trigger Jenkins Deploy
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync docker-compose & Deploy containers on Spot VM
        run: |
          echo "=== Syncing docker-compose.yml to VM ==="
          cat docker-compose.yml | gcloud compute ssh "${{ env.VM_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --quiet \
            --command="sudo tee /opt/shopnest/docker-compose.yml > /dev/null"

          echo "=== Pulling latest images & Restarting containers ==="
          gcloud compute ssh "${{ env.VM_NAME }}" --zone="${{ env.GCP_ZONE }}" --quiet --command="
            cd /opt/shopnest
            echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull backend frontend
            sudo docker compose up -d --force-recreate backend frontend
            sudo docker compose ps
          "

          echo "=== Triggering Jenkins deploy webhook (optional backup) ==="
          gcloud compute ssh "${{ env.VM_NAME }}" --zone="${{ env.GCP_ZONE }}" --quiet --command="
            curl -s -X POST 'http://localhost:8080/generic-webhook-trigger/invoke?token=shopnest-deploy' \
              -H 'Content-Type: application/json' \
              -d '{\"sha\": \"${{ github.sha }}\"}' || true
          "
          echo "Deploy completed for sha: ${{ github.sha }}"

      - name: Healthcheck deployed services
        run: |
          echo "=== Verifying deployed service health on VM ==="
          gcloud compute ssh "${{ env.VM_NAME }}" --zone="${{ env.GCP_ZONE }}" --quiet --command="
            for i in \$(seq 1 6); do
              API_CODE=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/health)
              FE_CODE=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
              if [ \"\$API_CODE\" = '200' ] && [ \"\$FE_CODE\" = '200' ]; then
                echo \"✅ Healthcheck PASSED: API HTTP \$API_CODE, Frontend HTTP \$FE_CODE\"
                exit 0
              fi
              echo \"Attempt \$i/6: API=\$API_CODE, Frontend=\$FE_CODE. Waiting 5s...\"
              sleep 5
            done
            echo '❌ Healthcheck FAILED'
            exit 1
          "
