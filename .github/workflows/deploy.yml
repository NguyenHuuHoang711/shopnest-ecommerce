name: ShopNest Fullstack CI/CD (Nginx + Backend on LXC)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci-test:
    name: Test build (npm install & npm start)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test server startup & healthcheck
        run: |
          npm start &
          PID=$!
          sleep 3
          curl -f http://localhost:3000/api/health || (echo "Healthcheck failed" && kill $PID && exit 1)
          echo "Server started successfully and passed healthcheck!"
          kill $PID

  deploy-lxc:
    name: Deploy Fullstack (Nginx + Node.js) to LXC Container
    needs: ci-test
    runs-on: [self-hosted, shopnest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Docker Compose
        run: |
          echo "Stopping previous containers..."
          docker compose down --remove-orphans || true
          
          echo "Building and starting services..."
          docker compose up -d --build
          
          echo "Waiting for services to become healthy..."
          sleep 5
          docker compose ps

      - name: Verify Health & Security Protection
        run: |
          echo "=== 1. Checking API Health via Nginx ==="
          curl -f http://localhost:3000/api/health
          echo -e "\nAPI Health check PASSED!"

          echo "=== 2. Verifying Security: Blocking .env access ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/.env)
          if [ "$STATUS" = "404" ] || [ "$STATUS" = "403" ]; then
            echo "Security check PASSED: .env returned HTTP $STATUS (blocked by Nginx)."
          else
            echo "Security check FAILED: .env returned HTTP $STATUS"
            exit 1
          fi

          echo "=== 3. Verifying Security: Blocking .db access ==="
          STATUS_DB=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/shopnest.db)
          if [ "$STATUS_DB" = "404" ] || [ "$STATUS_DB" = "403" ]; then
            echo "Security check PASSED: shopnest.db returned HTTP $STATUS_DB (blocked by Nginx)."
          else
            echo "Security check FAILED: shopnest.db returned HTTP $STATUS_DB"
            exit 1
          fi

          echo "=== 4. Checking Static Caching Headers ==="
          CACHE_HEADER=$(curl -s -I http://localhost:3000/css/style.css 2>/dev/null | grep -i "cache-control" || true)
          echo "Cache-Control: $CACHE_HEADER"

          echo "🎉 ShopNest Fullstack with Nginx Reverse Proxy deployed securely on LXC!"
