name: Eco-Test CI/CD (BE on LXC & FE on R2)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci-test:
    name: Test build (npm install & npm start)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test server startup & healthcheck
        run: |
          npm start &
          PID=$!
          sleep 3
          curl -f http://localhost:3000/api/health || (echo "Healthcheck failed" && kill $PID && exit 1)
          echo "Server started successfully and passed healthcheck!"
          kill $PID

  deploy-api:
    name: Deploy API to LXC Container (Docker Compose)
    needs: ci-test
    runs-on: [self-hosted, shopnest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Docker Compose
        run: |
          docker compose down --remove-orphans || true
          docker compose up -d --build
          sleep 5
          docker compose ps
          curl -f http://localhost:3000/api/health
          echo "API deployed successfully on LXC container!"

  deploy-fe-r2:
    name: Deploy Frontend to Cloudflare R2
    needs: ci-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Frontend to Cloudflare R2
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'eco-test-frontend' }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "⚠️ Cloudflare R2 credentials (CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) not configured in GitHub Secrets yet."
            echo "Skipping R2 upload. Once secrets are provided, this will automatically upload frontend files to R2."
            exit 0
          fi
          echo "Syncing frontend files to Cloudflare R2 bucket: $R2_BUCKET_NAME..."
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"
          aws s3 sync public/ s3://$R2_BUCKET_NAME/ --endpoint-url https://${ACCOUNT_ID}.r2.cloudflarestorage.com --delete
          echo "🎉 Frontend synced to R2 successfully!"
