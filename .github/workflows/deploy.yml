name: ShopNest CI — Build & Push to GHCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────
  # JOB 1: Test on GitHub Cloud runner
  # ────────────────────────────────────────────
  ci-test:
    name: Test (npm install & healthcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test server startup & healthcheck
        run: |
          npm start &
          PID=$!
          sleep 3
          curl -f http://localhost:3000/api/health || (kill $PID && exit 1)
          echo "Healthcheck passed!"
          kill $PID

  # ────────────────────────────────────────────
  # JOB 2: Build & Push image to GHCR
  # ────────────────────────────────────────────
  build-push:
    name: Build & Push Docker image to GHCR
    needs: ci-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### ✅ Image pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Jenkins will automatically pull and deploy this image." >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────
  # JOB 3: Trigger Jenkins via webhook (self-hosted runner trong LXC)
  # ────────────────────────────────────────────
  trigger-jenkins:
    name: Trigger Jenkins deploy pipeline
    needs: build-push
    runs-on: [self-hosted, shopnest]
    steps:
      - name: Trigger Jenkins pipeline via webhook
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          echo "Triggering Jenkins to deploy: $IMAGE"
          curl -s -o /dev/null -w "Jenkins webhook: HTTP %{http_code}\n" \
            -X POST "http://localhost:8080/generic-webhook-trigger/invoke?token=shopnest-deploy" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"${IMAGE}\", \"sha\": \"${{ github.sha }}\"}" || true
          echo "Jenkins deploy triggered!"
