version: '3.8'

services:
  # ─── Database: MongoDB ───
  mongodb:
    image: mongo:7.0
    container_name: shopnest-mongo
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=shopnest

  # ─── Backend: Node.js API (Express 5 + MongoDB) ───
  backend:
    image: ghcr.io/nguyenhuuhoang711/shopnest-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopnest-backend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - mongodb
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/shopnest
      - JWT_SECRET=shopnest_jwt_secret_super_secure_key_2026
      - CLIENT_URL=https://shopnest.asao.vn

  # ─── Frontend: React SPA served by Nginx + API reverse proxy ───
  frontend:
    image: ghcr.io/nguyenhuuhoang711/shopnest-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopnest-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # ─── Jenkins: CI/CD Automation ───
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: shopnest-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /opt/shopnest:/opt/shopnest
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/local/lib/docker/cli-plugins/docker-compose:ro
    environment:
      - JENKINS_OPTS=--prefix=/
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

  # ─── Cloudflare Tunnel: expose shopnest.asao.vn ───
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shopnest-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiODc2NTFkZjE0Y2M0ZjIzM2YzZDg2MWFhZjYzZDgyNDUiLCJ0IjoiYjY2ZTQ4MTgtMGE4Ni00ZGRhLWE4ZWUtMjkyYjZkYTJmNDlhIiwicyI6ImE4TWlDNDZQRnEyTUpQOVFRUTA2YktwNE1Qc2UrRjgwZlREZmZGOWY2QVU9In0= --url http://frontend:80
    depends_on:
      - frontend

volumes:
  mongo_data:
  jenkins_home:
