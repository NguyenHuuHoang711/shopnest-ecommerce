version: '3.8'

services:
  # ─── Backend: pull image từ GHCR (Jenkins deploy sẽ update image tag) ───
  backend:
    image: ghcr.io/nguyenhuuhoang711/shopnest-ecommerce:latest
    container_name: shopnest-backend
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - shopnest_db:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production

  # ─── Nginx: Reverse proxy ShopNest ───
  nginx:
    image: nginx:alpine
    container_name: shopnest-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/shopnest.conf:/etc/nginx/conf.d/shopnest.conf:ro
    depends_on:
      - backend

  # ─── Jenkins: CI/CD Dashboard ───
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: shopnest-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JENKINS_OPTS=--prefix=/
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

volumes:
  shopnest_db:
  jenkins_home:
