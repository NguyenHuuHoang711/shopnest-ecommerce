version: '3.8'

services:
  backend:
    build: .
    container_name: shopnest-backend
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - shopnest_db:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: shopnest-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  shopnest_db:
